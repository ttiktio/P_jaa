        const appItems = Object.values(APPS).map(app => ({
          kind: 'app',
          id: app.id,
          label: app.name,
          icon: app.icon
        }));

        let fsDesktopItems = [];
        try {
          fsDesktopItems = VFS.list('/Desktop').map(entry => ({
            kind: entry.type,
            path: entry.path,
            label: entry.name,
            icon: entry.type === 'dir' ? ICONS.folder : (/\.(html|css|js)$/i.test(entry.name) ? ICONS.fileCode : ICONS.fileText)
          }));
        } catch (_) {}

        const all = [...appItems, ...fsDesktopItems];
        desktopIconsEl.innerHTML = all.map((item, idx) => `
          <button type="button" class="desktop-icon" role="listitem" data-idx="${idx}"
            data-kind="${item.kind}" data-target="${escapeHtml(item.id || item.path)}">
            <span class="desktop-icon-glyph" aria-hidden="true">${item.icon}</span>
            <span class="desktop-icon-label">${escapeHtml(item.label)}</span>
          </button>
        `).join('');
      }

      function activateDesktopIcon(btn) {
        const kind = btn.dataset.kind;
        const target = btn.dataset.target;
        if (kind === 'app') WM.open(target);
        else if (kind === 'dir') WM.open('explorer', { path: target });
        else WM.open('editor', { filePath: target });
      }

      desktopIconsEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.desktop-icon');
        desktopIconsEl.querySelectorAll('.desktop-icon').forEach(b => b.classList.toggle('selected', b === btn));
      });

      desktopIconsEl.addEventListener('dblclick', (e) => {
        const btn = e.target.closest('.desktop-icon');
        if (btn) activateDesktopIcon(btn);
      });

      desktopIconsEl.addEventListener('keydown', (e) => {
        const btn = e.target.closest('.desktop-icon');
        if (btn && e.key === 'Enter') {
          e.preventDefault();
          activateDesktopIcon(btn);
        }
      });

      desktopEl.addEventListener('pointerdown', (e) => {
        if (e.target === desktopEl || e.target === desktopIconsEl) {
          desktopIconsEl.querySelectorAll('.desktop-icon.selected').forEach(b => b.classList.remove('selected'));
          closeMenus();
        }
      });

      function renderTaskbar() {
        tbWindows.innerHTML = [...WM.windows.values()].map(w => {
          const meta = APPS[w.appId];
          const isActive = WM.activeId === w.id && !w.minimized;
          return `
            <button type="button" class="tb-win-btn ${isActive ? 'active' : ''} ${w.minimized ? 'minimized' : ''}"
              data-wid="${w.id}" role="tab" aria-selected="${isActive}">
              <span class="win-app-icon" aria-hidden="true">${meta ? meta.icon : ''}</span>
              <span class="tb-win-title">${escapeHtml(w.title)}</span>
            </button>
          `;
        }).join('');
      }

      tbWindows.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-wid]');
        if (!btn) return;
        const wid = btn.dataset.wid;
        const w = WM.windows.get(wid);
        if (!w) return;
        closeMenus();
        if (w.minimized) WM.restore(wid);
        else if (WM.activeId === wid) WM.minimize(wid);
        else WM.focus(wid);
      });

      function renderStartMenu(query = '') {
        const q = query.trim().toLowerCase();
        const apps = Object.values(APPS).filter(a => !q || a.name.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q));
        smApps.innerHTML = apps.map(a => `
          <button type="button" class="sm-app-card" data-launch="${a.id}">
            <span class="sm-app-icon" aria-hidden="true">${a.icon}</span>
            <span class="sm-app-meta">
              <div class="sm-app-name">${escapeHtml(a.name)}</div>
              <div class="sm-app-desc">${escapeHtml(a.desc)}</div>
            </span>
          </button>
        `).join('');

        if (q) {
          const fileHits = VFS.allFiles().filter(p => p.toLowerCase().includes(q)).slice(0, 8);
          document.querySelector('#sm-files-section .sm-section-label').textContent = 'Matching Files';
          smPlaces.innerHTML = fileHits.length
            ? fileHits.map(p => `<button type="button" class="sm-place-chip" data-open-file="${escapeHtml(p)}">📄 ${escapeHtml(p)}</button>`).join('')
            : `<span style="font-size:12px;color:var(--muted)">No matching virtual files</span>`;
        } else {
          document.querySelector('#sm-files-section .sm-section-label').textContent = 'Quick Folders';
          const folders = ['/Desktop', '/Documents', '/Projects', '/Projects/webapp'].filter(p => VFS.exists(p));
          smPlaces.innerHTML = folders.map(p => `<button type="button" class="sm-place-chip" data-open-dir="${escapeHtml(p)}">📁 ${escapeHtml(p)}</button>`).join('');
        }
      }

      function toggleStartMenu(force) {
        const next = typeof force === 'boolean' ? force : !startMenu.classList.contains('open');
        ctxMenu.classList.remove('open');
        startMenu.classList.toggle('open', next);
        startBtn.setAttribute('aria-expanded', String(next));
        if (next) {
          smSearch.value = '';
          renderStartMenu('');
          setTimeout(() => smSearch.focus(), 20);
        }
      }

      function closeMenus() {
        toggleStartMenu(false);
        ctxMenu.classList.remove('open');
      }

      startBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleStartMenu();
      });

      smSearch.addEventListener('input', () => renderStartMenu(smSearch.value));

      startMenu.addEventListener('click', (e) => {
        const appId = e.target.closest('[data-launch]')?.dataset.launch;
        if (appId) { closeMenus(); WM.open(appId); return; }
        const dir = e.target.closest('[data-open-dir]')?.dataset.openDir;
        if (dir) { closeMenus(); WM.open('explorer', { path: dir }); return; }
        const file = e.target.closest('[data-open-file]')?.dataset.openFile;
        if (file) { closeMenus(); WM.open('editor', { filePath: file }); return; }
      });

      document.getElementById('sm-tile-btn').addEventListener('click', () => { closeMenus(); WM.tileWindows(); });
      document.getElementById('sm-cascade-btn').addEventListener('click', () => { closeMenus(); WM.cascadeWindows(); });
      document.getElementById('sm-close-all-btn').addEventListener('click', () => { closeMenus(); WM.closeAll(); });
      document.getElementById('tb-monitor-btn').addEventListener('click', () => { closeMenus(); WM.open('monitor'); });
      document.getElementById('tb-settings-btn').addEventListener('click', () => { closeMenus(); WM.open('settings'); });

      desktopEl.addEventListener('contextmenu', (e) => {
        if (e.target.closest('.os-window')) return;
        e.preventDefault();
        toggleStartMenu(false);

        const iconBtn = e.target.closest('.desktop-icon');
        let items = [];

        if (iconBtn) {
          const kind = iconBtn.dataset.kind;
          const target = iconBtn.dataset.target;
          items.push({ label: 'Open', action: () => activateDesktopIcon(iconBtn) });
          if (kind !== 'app' && target !== '/Desktop') {
            items.push({
              label: 'Delete from Desktop',
              danger: true,
              action: async () => {
                try { await VFS.remove(target, true); notify('Removed from Desktop'); } catch (_) {}
              }
            });
          }
        } else {
          items = [
            { label: 'New Text File on Desktop', action: async () => {
              let idx = 1;
              while (VFS.exists(`/Desktop/note-${idx}.txt`)) idx++;
              const p = `/Desktop/note-${idx}.txt`;
              await VFS.writeFile(p, 'New desktop note\n');
              WM.open('editor', { filePath: p });
            }},
            { label: 'New Folder on Desktop', action: async () => {
              let idx = 1;
              while (VFS.exists(`/Desktop/Folder-${idx}`)) idx++;
              await VFS.mkdir(`/Desktop/Folder-${idx}`);
            }},
            { sep: true },
            { label: 'Open Terminal Here', kbd: 'Alt+2', action: () => WM.open('terminal', { cwd: '/Desktop' }) },
            { label: 'Tile Open Windows', action: () => WM.tileWindows() },
            { label: 'Cascade Windows', action: () => WM.cascadeWindows() },
            { sep: true },
            { label: 'Cycle Color Theme', action: async () => {
              const order = ['obsidian', 'violet', 'emerald', 'amber', 'daylight'];
              const next = order[(order.indexOf(SettingsState.data.theme) + 1) % order.length];
              await SettingsState.update({ theme: next });
              notify(`Theme: ${next}`);
            }},
            { label: 'System Settings', kbd: 'Alt+5', action: () => WM.open('settings') }
          ];
        }

        ctxMenu.innerHTML = items.map((it, i) => it.sep
          ? `<div class="ctx-sep" role="separator"></div>`
          : `<button type="button" class="ctx-item ${it.danger ? 'danger' : ''}" data-cidx="${i}" role="menuitem">
               <span>${escapeHtml(it.label)}</span>
               ${it.kbd ? `<span class="ctx-kbd">${escapeHtml(it.kbd)}</span>` : ''}
             </button>`
        ).join('');

        ctxMenu.classList.add('open');
        const x = Math.min(e.clientX, window.innerWidth - 225);
        const y = Math.min(e.clientY, window.innerHeight - 260);
        ctxMenu.style.left = `${Math.max(6, x)}px`;
        ctxMenu.style.top = `${Math.max(6, y)}px`;

        ctxMenu.onclick = (ev) => {
          const btn = ev.target.closest('button[data-cidx]');
          if (!btn) return;
          const item = items[Number(btn.dataset.cidx)];
          ctxMenu.classList.remove('open');
          if (item && item.action) item.action();
        };
      });

      document.addEventListener('pointerdown', (e) => {
        if (!e.target.closest('#start-menu') && !e.target.closest('#start-btn')) {
          toggleStartMenu(false);
        }
        if (!e.target.closest('#context-menu')) {
          ctxMenu.classList.remove('open');
        }
      });

      function updateClock() {
        const now = new Date();
        document.getElementById('tb-clock-time').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('tb-clock-date').textContent = now.toLocaleDateString([], { month: 'short', day: 'numeric' });
      }
      updateClock();
      setInterval(updateClock, 10000);

      /* =====================================================================
         9. GLOBAL KEYBOARD SHORTCUTS
      ===================================================================== */
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeMenus();
          return;
        }
        if (e.altKey && !e.ctrlKey && !e.metaKey) {
          const k = e.key.toLowerCase();
          if (k === 's' || e.code === 'Space') { e.preventDefault(); toggleStartMenu(); }
          else if (k === '1') { e.preventDefault(); closeMenus(); WM.open('explorer'); }
          else if (k === '2') { e.preventDefault(); closeMenus(); WM.open('terminal'); }
          else if (k === '3') { e.preventDefault(); closeMenus(); WM.open('editor'); }
          else if (k === '4') { e.preventDefault(); closeMenus(); WM.open('monitor'); }
          else if (k === '5') { e.preventDefault(); closeMenus(); WM.open('settings'); }
          else if (k === 'w' && WM.activeId) { e.preventDefault(); WM.close(WM.activeId); }
          else if (k === 'm' && WM.activeId) { e.preventDefault(); WM.minimize(WM.activeId); }
          else if (e.key === 'Enter' && WM.activeId) { e.preventDefault(); WM.toggleMaximize(WM.activeId); }
          else if (e.key === ']') { e.preventDefault(); WM.cycleFocus(); }
        }
      });

      /* =====================================================================
         10. HELPERS & KERNEL BOOTSTRAP
      ===================================================================== */
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function formatBytes(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
      }

      function triggerDownload(filename, content) {
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      Bus.on('fs:change', renderDesktopIcons);
      Bus.on('wm:change', renderTaskbar);

      async function boot() {
        await NexusStorage.init();
        await SettingsState.init();
        await VFS.init();
        renderDesktopIcons();
        renderTaskbar();

        const desk = desktopEl.getBoundingClientRect();
        if (desk.width >= 760) {
          WM.open('editor');
        } else {
          WM.open('explorer');
        }
      }

      boot();
    })();
  </script>
</body>
</html>
