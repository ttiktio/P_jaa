      const VFS = {
        nodes: {},

        async init() {
          const saved = await NexusStorage.get('vfs_nodes');
          if (saved && typeof saved === 'object' && saved['/'] && saved['/Desktop']) {
            this.nodes = saved;
          } else {
            this.nodes = buildDefaultFS();
            await this.persist();
          }
        },

        async persist() {
          await NexusStorage.set('vfs_nodes', this.nodes);
          Bus.emit('fs:change');
        },

        async reset() {
          this.nodes = buildDefaultFS();
          await this.persist();
        },

        normalize(path, cwd = '/') {
          if (!path || path === '.') return cwd;
          const full = path.startsWith('/') ? path : (cwd === '/' ? '/' + path : cwd + '/' + path);
          const parts = full.split('/');
          const stack = [];
          for (const part of parts) {
            if (!part || part === '.') continue;
            if (part === '..') stack.pop();
            else stack.push(part);
          }
          return '/' + stack.join('/');
        },

        parent(path) {
          const norm = this.normalize(path);
          if (norm === '/') return '/';
          const idx = norm.lastIndexOf('/');
          return idx <= 0 ? '/' : norm.slice(0, idx);
        },

        basename(path) {
          const norm = this.normalize(path);
          if (norm === '/') return '/';
          return norm.slice(norm.lastIndexOf('/') + 1);
        },

        exists(path) {
          return Boolean(this.nodes[this.normalize(path)]);
        },

        stat(path) {
          return this.nodes[this.normalize(path)] || null;
        },

        list(dirPath) {
          const dir = this.normalize(dirPath);
          const node = this.nodes[dir];
          if (!node || node.type !== 'dir') throw new Error(`Not a directory: ${dir}`);
          const prefix = dir === '/' ? '/' : dir + '/';
          const entries = [];
          for (const [p, meta] of Object.entries(this.nodes)) {
            if (p === dir || !p.startsWith(prefix)) continue;
            const rest = p.slice(prefix.length);
            if (!rest.includes('/')) {
              entries.push({
                name: rest,
                path: p,
                type: meta.type,
                mtime: meta.mtime || Date.now(),
                size: meta.type === 'file' ? new Blob([meta.content || '']).size : 0
              });
            }
          }
          return entries.sort((a, b) => {
            if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
            return a.name.localeCompare(b.name);
          });
        },

        readFile(path) {
          const p = this.normalize(path);
          const node = this.nodes[p];
          if (!node) throw new Error(`No such file: ${p}`);
          if (node.type !== 'file') throw new Error(`Is a directory: ${p}`);
          return node.content ?? '';
        },

        async writeFile(path, content = '') {
          const p = this.normalize(path);
          const par = this.parent(p);
          if (!this.nodes[par] || this.nodes[par].type !== 'dir') {
            throw new Error(`Parent directory does not exist: ${par}`);
          }
          if (this.nodes[p] && this.nodes[p].type === 'dir') {
            throw new Error(`Cannot overwrite directory with file: ${p}`);
          }
          this.nodes[p] = { type: 'file', content: String(content), mtime: Date.now() };
          await this.persist();
        },

        async mkdir(path) {
          const p = this.normalize(path);
          if (this.nodes[p]) throw new Error(`Path already exists: ${p}`);
          const par = this.parent(p);
          if (!this.nodes[par] || this.nodes[par].type !== 'dir') {
            throw new Error(`Parent directory does not exist: ${par}`);
          }
          this.nodes[p] = { type: 'dir', mtime: Date.now() };
          await this.persist();
        },

        async remove(path, recursive = false) {
          const p = this.normalize(path);
          if (p === '/' || p === '/Desktop') throw new Error(`Protected system path: ${p}`);
          const node = this.nodes[p];
          if (!node) throw new Error(`No such file or directory: ${p}`);
          if (node.type === 'dir') {
            const children = Object.keys(this.nodes).filter(k => k.startsWith(p + '/'));
            if (children.length > 0 && !recursive) {
              throw new Error(`Directory not empty (use -r): ${p}`);
            }
            for (const c of children) delete this.nodes[c];
          }
          delete this.nodes[p];
          await this.persist();
        },

        async move(src, dest) {
          const s = this.normalize(src);
          let d = this.normalize(dest);
          if (s === '/' || s === '/Desktop') throw new Error(`Cannot move protected path: ${s}`);
          if (!this.nodes[s]) throw new Error(`Source does not exist: ${s}`);
          if (this.nodes[d] && this.nodes[d].type === 'dir') {
            d = this.normalize(d + '/' + this.basename(s));
          }
          if (d === s) return d;
          if (d.startsWith(s + '/')) throw new Error('Cannot move a directory into itself');
          const par = this.parent(d);
          if (!this.nodes[par] || this.nodes[par].type !== 'dir') {
            throw new Error(`Destination folder does not exist: ${par}`);
          }
          const updates = [];
          for (const [k, val] of Object.entries(this.nodes)) {
            if (k === s || k.startsWith(s + '/')) {
              const nextKey = d + k.slice(s.length);
              updates.push([k, nextKey, { ...val, mtime: Date.now() }]);
            }
          }
          for (const [oldK] of updates) delete this.nodes[oldK];
          for (const [, newK, val] of updates) this.nodes[newK] = val;
          await this.persist();
          return d;
        },

        async copy(src, dest) {
          const s = this.normalize(src);
          let d = this.normalize(dest);
          if (!this.nodes[s]) throw new Error(`Source does not exist: ${s}`);
          if (this.nodes[d] && this.nodes[d].type === 'dir') {
            d = this.normalize(d + '/' + this.basename(s));
          }
          if (d.startsWith(s + '/')) throw new Error('Cannot copy a directory into itself');
          const par = this.parent(d);
          if (!this.nodes[par] || this.nodes[par].type !== 'dir') {
            throw new Error(`Destination folder does not exist: ${par}`);
          }
          for (const [k, val] of Object.entries(this.nodes)) {
            if (k === s || k.startsWith(s + '/')) {
              const nextKey = d + k.slice(s.length);
              this.nodes[nextKey] = { ...val, mtime: Date.now() };
            }
          }
          await this.persist();
        },

        stats() {
          let files = 0, dirs = 0, bytes = 0;
          for (const node of Object.values(this.nodes)) {
            if (node.type === 'dir') dirs++;
            else {
              files++;
              bytes += new Blob([node.content || '']).size;
            }
          }
          return { files, dirs, bytes };
        },

        allFiles() {
          return Object.entries(this.nodes)
            .filter(([, n]) => n.type === 'file')
            .map(([p]) => p)
            .sort();
        }
      };

      /* =====================================================================
         5. OS SETTINGS & THEMES
      ===================================================================== */
      const DEFAULT_SETTINGS = {
        theme: 'obsidian',
        wallpaper: 'aurora',
        scale: 'default',
        reducedMotion: false
      };

      const SettingsState = {
        data: { ...DEFAULT_SETTINGS },

        async init() {
          const saved = await NexusStorage.get('os_settings');
          if (saved && typeof saved === 'object') {
            this.data = { ...DEFAULT_SETTINGS, ...saved };
          }
          this.apply();
        },

        apply() {
          const root = document.documentElement;
          root.dataset.theme = this.data.theme;
          root.dataset.wallpaper = this.data.wallpaper;
          root.dataset.scale = this.data.scale;
          root.dataset.motion = this.data.reducedMotion ? 'reduced' : 'normal';
          Bus.emit('settings:change', this.data);
        },

        async update(patch) {
          this.data = { ...this.data, ...patch };
          this.apply();
          await NexusStorage.set('os_settings', this.data);
        },

        async reset() {
          this.data = { ...DEFAULT_SETTINGS };
          this.apply();
          await NexusStorage.set('os_settings', this.data);
        }
      };

      /* =====================================================================
         6. MULTI-WINDOW MANAGER (Draggable, 8-Way Resizable, Edge Snapping)
      ===================================================================== */
      const WM = {
        windows: new Map(),
        nextPid: 101,
        topZ: 100,
        activeId: null,
        layer: document.getElementById('windows-layer'),
        snapEl: document.getElementById('snap-preview'),

        open(appId, launchArgs = {}) {
          const meta = APPS[appId];
          if (!meta) return null;

          if (appId === 'settings' || appId === 'monitor' || (appId === 'editor' && launchArgs.filePath)) {
            for (const [wid, w] of this.windows.entries()) {
              if (w.appId === appId) {
                if (w.minimized) this.restore(wid);
                this.focus(wid);
                if (w.api && typeof w.api.onLaunchArgs === 'function') {
                  w.api.onLaunchArgs(launchArgs);
                }
                return wid;
              }
            }
          }

          const pid = this.nextPid++;
          const wid = 'win-' + pid;
          const deskRect = document.getElementById('desktop').getBoundingClientRect();
          const cascade = (this.windows.size % 6) * 26;
          const w = Math.min(meta.width, Math.max(310, deskRect.width - 24));
          const h = Math.min(meta.height, Math.max(240, deskRect.height - 24));
          const x = Math.max(12, Math.min(deskRect.width - w - 12, 60 + cascade));
          const y = Math.max(12, Math.min(deskRect.height - h - 12, 30 + cascade));

          const el = document.createElement('section');
          el.className = 'os-window';
          el.id = wid;
          el.setAttribute('role', 'dialog');
          el.setAttribute('aria-label', meta.name);
          el.style.left = `${x}px`;
          el.style.top = `${y}px`;
          el.style.width = `${w}px`;
          el.style.height = `${h}px`;

          el.innerHTML = `
            <div class="win-titlebar">
              <div class="win-title-group">
                <span class="win-app-icon" aria-hidden="true">${meta.icon}</span>
                <span class="win-title">${escapeHtml(meta.name)}</span>
              </div>
              <div class="win-controls">
                <button type="button" class="win-ctrl-btn min" title="Minimize (Alt+M)" aria-label="Minimize ${escapeHtml(meta.name)}">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <button type="button" class="win-ctrl-btn max" title="Maximize or Restore (Alt+Enter)" aria-label="Maximize ${escapeHtml(meta.name)}">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
                </button>
                <button type="button" class="win-ctrl-btn close" title="Close (Alt+W)" aria-label="Close ${escapeHtml(meta.name)}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
              </div>
            </div>
            <div class="win-body"></div>
            <div class="resize-handle rh-n" data-dir="n"></div>
            <div class="resize-handle rh-s" data-dir="s"></div>
            <div class="resize-handle rh-e" data-dir="e"></div>
            <div class="resize-handle rh-w" data-dir="w"></div>
            <div class="resize-handle rh-ne" data-dir="ne"></div>
            <div class="resize-handle rh-nw" data-dir="nw"></div>
            <div class="resize-handle rh-se" data-dir="se"></div>
            <div class="resize-handle rh-sw" data-dir="sw"></div>
          `;

          this.layer.appendChild(el);

          const winObj = {
            id: wid,
            pid,
            appId,
            title: meta.name,
            el,
            bodyEl: el.querySelector('.win-body'),
            titleEl: el.querySelector('.win-title'),
            minimized: false,
            maximized: deskRect.width < 640,
            rect: { x, y, w, h },
            cleanupFns: [],
            api: null
          };

          if (winObj.maximized) el.classList.add('maximized');
          this.windows.set(wid, winObj);
          this.bindWindowEvents(winObj);

          winObj.api = AppMount[appId](winObj, launchArgs) || {};
          this.focus(wid);
          Bus.emit('wm:change');
          return wid;
        },

        setTitle(wid, title) {
          const w = this.windows.get(wid);
          if (!w) return;
          w.title = title;
          w.titleEl.textContent = title;
          Bus.emit('wm:change');
        },

        focus(wid) {
          const target = this.windows.get(wid);
          if (!target || target.minimized) return;
          this.topZ += 1;
          target.el.style.zIndex = String(this.topZ);
          this.activeId = wid;
          for (const [id, w] of this.windows.entries()) {
            w.el.classList.toggle('focused', id === wid);
          }
          if (target.api && typeof target.api.onFocus === 'function') {
            target.api.onFocus();
          }
          Bus.emit('wm:change');
        },

        minimize(wid) {
          const w = this.windows.get(wid);
          if (!w) return;
          w.minimized = true;
          w.el.classList.add('minimized');
          if (this.activeId === wid) {
            this.activeId = this.findNextTopWindow(wid);
            if (this.activeId) this.focus(this.activeId);
          }
          Bus.emit('wm:change');
        },

        restore(wid) {
          const w = this.windows.get(wid);
          if (!w) return;
          w.minimized = false;
          w.el.classList.remove('minimized');
          this.focus(wid);
          Bus.emit('wm:change');
        },

        toggleMaximize(wid) {
          const w = this.windows.get(wid);
          if (!w) return;
          w.maximized = !w.maximized;
          w.el.classList.toggle('maximized', w.maximized);
          if (!w.maximized) this.applyRect(w);
          this.focus(wid);
          Bus.emit('wm:change');
        },

        close(wid) {
          const w = this.windows.get(wid);
          if (!w) return;
          for (const fn of w.cleanupFns) {
            try { fn(); } catch (_) {}
          }
          w.el.remove();
          this.windows.delete(wid);
          if (this.activeId === wid) {
            this.activeId = this.findNextTopWindow();
            if (this.activeId) this.focus(this.activeId);
          }
          Bus.emit('wm:change');
        },

        closeAll() {
          for (const wid of [...this.windows.keys()]) this.close(wid);
        },

        tileWindows() {
          const visible = [...this.windows.values()].filter(w => !w.minimized);
          if (!visible.length) return;
          const desk = document.getElementById('desktop').getBoundingClientRect();
          const cols = Math.ceil(Math.sqrt(visible.length));
          const rows = Math.ceil(visible.length / cols);
          const cellW = Math.floor(desk.width / cols);
          const cellH = Math.floor(desk.height / rows);

          visible.forEach((w, idx) => {
            const c = idx % cols;
            const r = Math.floor(idx / cols);
            w.maximized = false;
            w.el.classList.remove('maximized');
            w.rect = {
              x: c * cellW + 4,
              y: r * cellH + 4,
              w: Math.max(300, cellW - 8),
              h: Math.max(220, cellH - 8)
            };
            this.applyRect(w);
          });
          Bus.emit('wm:change');
        },

        cascadeWindows() {
          const visible = [...this.windows.values()].filter(w => !w.minimized);
          if (!visible.length) return;
          const desk = document.getElementById('desktop').getBoundingClientRect();
          visible.forEach((w, idx) => {
            const meta = APPS[w.appId] || { width: 700, height: 460 };
            const offset = (idx % 7) * 28;
            w.maximized = false;
            w.el.classList.remove('maximized');
            w.rect = {
              x: Math.min(desk.width - 320, 44 + offset),
              y: Math.min(desk.height - 240, 28 + offset),
              w: Math.min(meta.width, desk.width - 60),
              h: Math.min(meta.height, desk.height - 60)
            };
            this.applyRect(w);
            this.focus(w.id);
          });
        },

        cycleFocus() {
          const openIds = [...this.windows.values()]
            .filter(w => !w.minimized)
            .map(w => w.id);
          if (!openIds.length) return;
          const idx = openIds.indexOf(this.activeId);
          const next = openIds[(idx + 1) % openIds.length];
          this.focus(next);
        },

        findNextTopWindow(excludeId = null) {
          let best = null;
          let bestZ = -1;
          for (const [id, w] of this.windows.entries()) {
            if (id === excludeId || w.minimized) continue;
            const z = Number(w.el.style.zIndex || 0);
            if (z > bestZ) {
              bestZ = z;
              best = id;
            }
          }
          return best;
        },

        applyRect(w) {
          w.el.style.left = `${Math.round(w.rect.x)}px`;
          w.el.style.top = `${Math.round(w.rect.y)}px`;
          w.el.style.width = `${Math.round(w.rect.w)}px`;
          w.el.style.height = `${Math.round(w.rect.h)}px`;
        },

        clampAllToViewport() {
          const desk = document.getElementById('desktop').getBoundingClientRect();
          for (const w of this.windows.values()) {
            if (w.maximized) continue;
            w.rect.w = Math.min(w.rect.w, Math.max(300, desk.width - 12));
            w.rect.h = Math.min(w.rect.h, Math.max(220, desk.height - 12));
            w.rect.x = Math.max(0, Math.min(desk.width - 90, w.rect.x));
            w.rect.y = Math.max(0, Math.min(desk.height - 44, w.rect.y));
            this.applyRect(w);
          }
        },

        bindWindowEvents(w) {
          const { el, id } = w;
          el.addEventListener('pointerdown', () => this.focus(id));

          const titlebar = el.querySelector('.win-titlebar');
          const minBtn = el.querySelector('.win-ctrl-btn.min');
          const maxBtn = el.querySelector('.win-ctrl-btn.max');
          const closeBtn = el.querySelector('.win-ctrl-btn.close');

          minBtn.addEventListener('click', (e) => { e.stopPropagation(); this.minimize(id); });
          maxBtn.addEventListener('click', (e) => { e.stopPropagation(); this.toggleMaximize(id); });
          closeBtn.addEventListener('click', (e) => { e.stopPropagation(); this.close(id); });
          titlebar.addEventListener('dblclick', (e) => {
            if (e.target.closest('.win-controls')) return;
            this.toggleMaximize(id);
          });

          titlebar.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 || e.target.closest('.win-controls')) return;
            e.preventDefault();
            this.focus(id);
            const desk = document.getElementById('desktop').getBoundingClientRect();

            if (w.maximized) {
              const ratio = (e.clientX - desk.left) / desk.width;
              w.maximized = false;
              el.classList.remove('maximized');
              w.rect.w = Math.min(w.rect.w, desk.width * 0.75);
              w.rect.x = Math.max(0, (e.clientX - desk.left) - w.rect.w * ratio);
              w.rect.y = Math.max(0, e.clientY - desk.top - 18);
              this.applyRect(w);
            }

            const startX = e.clientX;
            const startY = e.clientY;
            const origX = w.rect.x;
            const origY = w.rect.y;
            let snapTarget = null;

            document.body.classList.add('is-interacting-window');
            titlebar.setPointerCapture(e.pointerId);

            const onMove = (ev) => {
              const dx = ev.clientX - startX;
              const dy = ev.clientY - startY;
              w.rect.x = Math.max(-w.rect.w + 90, Math.min(desk.width - 90, origX + dx));
              w.rect.y = Math.max(0, Math.min(desk.height - 38, origY + dy));
              this.applyRect(w);

              const relX = ev.clientX - desk.left;
              const relY = ev.clientY - desk.top;
              if (relY <= 8) {
                snapTarget = 'max';
                this.showSnap(0, 0, desk.width, desk.height);
              } else if (relX <= 10 && desk.width >= 620) {
                snapTarget = 'left';
                this.showSnap(0, 0, desk.width / 2, desk.height);
              } else if (relX >= desk.width - 10 && desk.width >= 620) {
                snapTarget = 'right';
                this.showSnap(desk.width / 2, 0, desk.width / 2, desk.height);
              } else {
                snapTarget = null;
                this.hideSnap();
              }
            };

            const onUp = () => {
              document.body.classList.remove('is-interacting-window');
              this.hideSnap();
              if (snapTarget === 'max') {
                w.maximized = true;
                el.classList.add('maximized');
              } else if (snapTarget === 'left') {
                w.rect = { x: 0, y: 0, w: Math.floor(desk.width / 2), h: desk.height };
                this.applyRect(w);
              } else if (snapTarget === 'right') {
                w.rect = { x: Math.floor(desk.width / 2), y: 0, w: Math.ceil(desk.width / 2), h: desk.height };
                this.applyRect(w);
              }
              titlebar.removeEventListener('pointermove', onMove);
              titlebar.removeEventListener('pointerup', onUp);
              titlebar.removeEventListener('pointercancel', onUp);
            };

            titlebar.addEventListener('pointermove', onMove);
            titlebar.addEventListener('pointerup', onUp);
            titlebar.addEventListener('pointercancel', onUp);
          });

          el.querySelectorAll('.resize-handle').forEach((handle) => {
            handle.addEventListener('pointerdown', (e) => {
              if (e.button !== 0 || w.maximized) return;
              e.preventDefault();
              e.stopPropagation();
              this.focus(id);

              const dir = handle.dataset.dir;
              const desk = document.getElementById('desktop').getBoundingClientRect();
              const startX = e.clientX;
              const startY = e.clientY;
              const orig = { ...w.rect };
              const minW = 300;
              const minH = 220;

              document.body.classList.add('is-interacting-window');
              handle.setPointerCapture(e.pointerId);

              const onMove = (ev) => {
                const dx = ev.clientX - startX;
                const dy = ev.clientY - startY;
                let { x, y, w: width, h: height } = orig;

                if (dir.includes('e')) width = Math.max(minW, Math.min(desk.width - x, orig.w + dx));
                if (dir.includes('s')) height = Math.max(minH, Math.min(desk.height - y, orig.h + dy));
                if (dir.includes('w')) {
                  const nextW = Math.max(minW, orig.w - dx);
                  const nextX = orig.x + (orig.w - nextW);
                  if (nextX >= 0) { x = nextX; width = nextW; }
                }
                if (dir.includes('n')) {
                  const nextH = Math.max(minH, orig.h - dy);
                  const nextY = orig.y + (orig.h - nextH);
                  if (nextY >= 0) { y = nextY; height = nextH; }
                }
                w.rect = { x, y, w: width, h: height };
                this.applyRect(w);
              };

              const onUp = () => {
                document.body.classList.remove('is-interacting-window');
                handle.removeEventListener('pointermove', onMove);
                handle.removeEventListener('pointerup', onUp);
                handle.removeEventListener('pointercancel', onUp);
              };

              handle.addEventListener('pointermove', onMove);
              handle.addEventListener('pointerup', onUp);
              handle.addEventListener('pointercancel', onUp);
            });
          });
        },

        showSnap(x, y, w, h) {
          this.snapEl.style.left = `${x + 6}px`;
          this.snapEl.style.top = `${y + 6}px`;
          this.snapEl.style.width = `${w - 12}px`;
          this.snapEl.style.height = `${h - 12}px`;
          this.snapEl.classList.add('visible');
        },

        hideSnap() {
          this.snapEl.classList.remove('visible');
        }
      };

      window.addEventListener('resize', () => WM.clampAllToViewport());

      /* =====================================================================
         7. APPLICATIONS
      ===================================================================== */
      const AppMount = {};

      /* ---------------- 7A. FILE EXPLORER ---------------- */
      AppMount.explorer = (win, args = {}) => {
        let currentDir = VFS.exists(args.path) && VFS.stat(args.path).type === 'dir' ? VFS.normalize(args.path) : '/Projects/webapp';
        let selectedPath = null;
        let viewMode = 'grid';
        let searchQuery = '';
        let promptMode = null;

        win.bodyEl.innerHTML = `
          <div class="exp-root">
            <div class="exp-toolbar">
              <button type="button" class="btn btn-sm" data-act="up" title="Parent Directory">Up</button>
              <nav class="exp-breadcrumbs" aria-label="Folder Path"></nav>
              <input type="search" class="input" data-role="search" placeholder="Filter folder..." style="width:132px" aria-label="Filter current folder">
              <button type="button" class="btn btn-sm" data-act="new-file">+ File</button>
              <button type="button" class="btn btn-sm" data-act="new-dir">+ Folder</button>
              <button type="button" class="btn btn-sm" data-act="rename" disabled>Rename</button>
              <button type="button" class="btn btn-sm" data-act="download" disabled title="Download selected file">Export</button>
              <button type="button" class="btn btn-sm btn-danger" data-act="delete" disabled>Delete</button>
              <button type="button" class="btn btn-sm" data-act="view" title="Toggle Grid or Details View">Details</button>
            </div>
            <div class="exp-prompt-bar" role="region" aria-label="File Action Prompt"></div>
            <div class="exp-body">
              <aside class="exp-sidebar" aria-label="Quick Locations"></aside>
              <div class="exp-main" tabindex="0"></div>
            </div>
            <div class="exp-statusbar">
              <span data-role="count">0 items</span>
              <span data-role="storage-hint">Persistent Storage Active</span>
            </div>
          </div>
        `;

        const crumbsEl = win.bodyEl.querySelector('.exp-breadcrumbs');
        const sidebarEl = win.bodyEl.querySelector('.exp-sidebar');
        const mainEl = win.bodyEl.querySelector('.exp-main');
        const promptBar = win.bodyEl.querySelector('.exp-prompt-bar');
        const searchInput = win.bodyEl.querySelector('[data-role="search"]');
        const renameBtn = win.bodyEl.querySelector('[data-act="rename"]');
        const downloadBtn = win.bodyEl.querySelector('[data-act="download"]');
        const deleteBtn = win.bodyEl.querySelector('[data-act="delete"]');
        const viewBtn = win.bodyEl.querySelector('[data-act="view"]');
        const countEl = win.bodyEl.querySelector('[data-role="count"]');
        const hintEl = win.bodyEl.querySelector('[data-role="storage-hint"]');

        function openItem(entry) {
          if (entry.type === 'dir') navigate(entry.path);
          else WM.open('editor', { filePath: entry.path });
        }

        function navigate(path) {
          try {
            const norm = VFS.normalize(path);
            if (!VFS.exists(norm) || VFS.stat(norm).type !== 'dir') return;
            currentDir = norm;
            selectedPath = null;
            closePrompt();
            render();
          } catch (_) {}
        }

        function openPrompt(mode) {
          promptMode = mode;
          promptBar.classList.add('open');
          if (mode === 'delete' && selectedPath) {
            promptBar.innerHTML = `
              <span>Delete <strong>${escapeHtml(VFS.basename(selectedPath))}</strong>?</span>
              <button type="button" class="btn btn-sm btn-danger" data-p="confirm-del">Delete Permanently</button>
              <button type="button" class="btn btn-sm" data-p="cancel">Cancel</button>
              <span data-p="err" style="color:var(--danger)"></span>
            `;
            promptBar.querySelector('[data-p="confirm-del"]').focus();
          } else {
            const initial = mode === 'rename' && selectedPath ? VFS.basename(selectedPath) : (mode === 'new-file' ? 'untitled.js' : 'new-folder');
            const label = mode === 'rename' ? 'Rename to:' : (mode === 'new-file' ? 'New file name:' : 'New folder name:');
            promptBar.innerHTML = `
              <label>${label}</label>
              <input type="text" class="input" data-p="name" value="${escapeHtml(initial)}" style="width:190px">
              <button type="button" class="btn btn-sm btn-primary" data-p="save">Confirm</button>
              <button type="button" class="btn btn-sm" data-p="cancel">Cancel</button>
              <span data-p="err" style="color:var(--danger)"></span>
            `;
            const inp = promptBar.querySelector('[data-p="name"]');
            inp.focus();
            inp.select();
          }
        }

        function closePrompt() {
          promptMode = null;
          promptBar.classList.remove('open');
          promptBar.innerHTML = '';
        }

        async function submitPrompt() {
          const errEl = promptBar.querySelector('[data-p="err"]');
          try {
            if (promptMode === 'delete' && selectedPath) {
              const name = VFS.basename(selectedPath);
              await VFS.remove(selectedPath, true);
              selectedPath = null;
              closePrompt();
              notify(`Deleted ${name}`);
              return;
            }
            const rawName = (promptBar.querySelector('[data-p="name"]')?.value || '').trim();
            if (!rawName || rawName.includes('/')) throw new Error('Enter a valid name without "/"');
            const targetPath = VFS.normalize(rawName, currentDir);
            if (promptMode === 'new-file') {
              if (VFS.exists(targetPath)) throw new Error('File already exists');
              await VFS.writeFile(targetPath, '');
              selectedPath = targetPath;
              notify(`Created ${rawName}`);
            } else if (promptMode === 'new-dir') {
              await VFS.mkdir(targetPath);
              selectedPath = targetPath;
              notify(`Created folder ${rawName}`);
            } else if (promptMode === 'rename' && selectedPath) {
              const moved = await VFS.move(selectedPath, targetPath);
              selectedPath = moved;
              notify(`Renamed to ${rawName}`);
            }
            closePrompt();
          } catch (err) {
            if (errEl) errEl.textContent = err.message;
          }
        }

        promptBar.addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-p]');
          if (!btn) return;
          if (btn.dataset.p === 'cancel') closePrompt();
          else submitPrompt();
        });
        promptBar.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); submitPrompt(); }
          if (e.key === 'Escape') { e.preventDefault(); closePrompt(); }
        });

        function render() {
          if (!VFS.exists(currentDir)) currentDir = '/';
          WM.setTitle(win.id, `File Explorer — ${currentDir}`);
          hintEl.textContent = `Backend: ${NexusStorage.backend}`;

          const places = [
            { label: 'Root (/)', path: '/' },
            { label: 'Desktop', path: '/Desktop' },
            { label: 'Documents', path: '/Documents' },
            { label: 'Projects', path: '/Projects' },
            { label: 'Webapp Demo', path: '/Projects/webapp' }
          ].filter(p => VFS.exists(p.path));

          sidebarEl.innerHTML = places.map(p => `
            <button type="button" class="exp-nav-item ${currentDir === p.path ? 'active' : ''}" data-nav="${escapeHtml(p.path)}">
              <span>${escapeHtml(p.label)}</span>
            </button>
          `).join('');

          const segs = currentDir === '/' ? [''] : currentDir.split('/');
          let built = '';
          crumbsEl.innerHTML = segs.map((s, idx) => {
            built = idx === 0 ? '/' : (built === '/' ? '/' + s : built + '/' + s);
            const label = idx === 0 ? '/' : s;
            const isLast = idx === segs.length - 1;
            return `<button type="button" class="exp-crumb ${isLast ? 'current' : ''}" data-crumb="${escapeHtml(built)}">${escapeHtml(label)}</button>${!isLast && idx > 0 ? '<span style="color:var(--muted)">/</span>' : ''}`;
          }).join('');

          let entries = VFS.list(currentDir);
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            entries = entries.filter(e => e.name.toLowerCase().includes(q));
          }

          if (selectedPath && !VFS.exists(selectedPath)) selectedPath = null;
          const selStat = selectedPath ? VFS.stat(selectedPath) : null;
          const isProtected = selectedPath === '/Desktop';
          renameBtn.disabled = !selectedPath || isProtected;
          deleteBtn.disabled = !selectedPath || isProtected;
          downloadBtn.disabled = !selStat || selStat.type !== 'file';
          countEl.textContent = `${entries.length} item${entries.length === 1 ? '' : 's'}${selectedPath ? ' • Selected: ' + VFS.basename(selectedPath) : ''}`;

          if (!entries.length) {
            mainEl.innerHTML = `
              <div class="empty-state">
                <div>This folder is empty.</div>
                <div style="font-size:12px">Use <strong>+ File</strong> or <strong>+ Folder</strong> above, or run commands in Terminal.</div>
              </div>
            `;
            return;
          }

          if (viewMode === 'grid') {
            mainEl.innerHTML = `<div class="exp-grid">${entries.map(e => `
              <div class="exp-card ${selectedPath === e.path ? 'selected' : ''}" data-path="${escapeHtml(e.path)}" tabindex="0" role="button" aria-label="${escapeHtml(e.name)}">
                <div style="color:${e.type === 'dir' ? 'var(--accent)' : 'var(--ink-secondary)'}">
                  ${e.type === 'dir' ? ICONS.folder : (/\.(html|css|js|json)$/i.test(e.name) ? ICONS.fileCode : ICONS.fileText)}
                </div>
                <div class="exp-card-name">${escapeHtml(e.name)}</div>
                <div class="exp-card-meta">${e.type === 'dir' ? 'Folder' : formatBytes(e.size)}</div>
              </div>
            `).join('')}</div>`;
          } else {
            mainEl.innerHTML = `
              <table class="exp-table">
                <thead>
                  <tr><th>Name</th><th>Type</th><th style="text-align:right">Size</th><th>Modified</th></tr>
                </thead>
                <tbody>
                  ${entries.map(e => `
                    <tr class="${selectedPath === e.path ? 'selected' : ''}" data-path="${escapeHtml(e.path)}" tabindex="0">
                      <td><strong>${e.type === 'dir' ? '📁 ' : '📄 '}${escapeHtml(e.name)}</strong></td>
                      <td>${e.type === 'dir' ? 'Directory' : ((e.name.includes('.') ? e.name.split('.').pop().toUpperCase() : 'TEXT') + ' File')}</td>
                      <td style="text-align:right">${e.type === 'dir' ? '—' : formatBytes(e.size)}</td>
                      <td>${new Date(e.mtime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            `;
          }
        }

        win.bodyEl.querySelector('.exp-toolbar').addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-act]');
          if (btn) {
            const act = btn.dataset.act;
            if (act === 'up') navigate(VFS.parent(currentDir));
            if (act === 'new-file') openPrompt('new-file');
            if (act === 'new-dir') openPrompt('new-dir');
            if (act === 'rename' && selectedPath) openPrompt('rename');
            if (act === 'delete' && selectedPath) openPrompt('delete');
            if (act === 'download' && selectedPath && VFS.stat(selectedPath)?.type === 'file') {
              triggerDownload(VFS.basename(selectedPath), VFS.readFile(selectedPath));
            }
            if (act === 'view') {
              viewMode = viewMode === 'grid' ? 'table' : 'grid';
              viewBtn.textContent = viewMode === 'grid' ? 'Details' : 'Grid';
              render();
            }
          }
          const crumb = e.target.closest('button[data-crumb]');
          if (crumb) navigate(crumb.dataset.crumb);
        });

        sidebarEl.addEventListener('click', (e) => {
          const nav = e.target.closest('button[data-nav]');
          if (nav) navigate(nav.dataset.nav);
        });

        searchInput.addEventListener('input', () => {
          searchQuery = searchInput.value.trim();
          render();
        });

        mainEl.addEventListener('click', (e) => {
          const item = e.target.closest('[data-path]');
          selectedPath = item ? item.dataset.path : null;
          render();
        });

        mainEl.addEventListener('dblclick', (e) => {
          const item = e.target.closest('[data-path]');
          if (!item) return;
          const st = VFS.stat(item.dataset.path);
          if (st) openItem({ path: item.dataset.path, type: st.type });
        });

        mainEl.addEventListener('keydown', (e) => {
          const item = e.target.closest('[data-path]');
          if (item && e.key === 'Enter') {
            const st = VFS.stat(item.dataset.path);
            if (st) openItem({ path: item.dataset.path, type: st.type });
          } else if (e.key === 'Delete' && selectedPath && selectedPath !== '/Desktop') {
            openPrompt('delete');
          }
        });

        win.cleanupFns.push(Bus.on('fs:change', render));
        render();

        return {
          onLaunchArgs(nextArgs) {
            if (nextArgs && nextArgs.path) navigate(nextArgs.path);
          }
        };
      };

      /* ---------------- 7B. TERMINAL ---------------- */
      AppMount.terminal = (win, args = {}) => {
        let cwd = args.cwd && VFS.exists(args.cwd) ? VFS.normalize(args.cwd) : '/Projects/webapp';
        const history = [];
        let histIdx = -1;

        win.bodyEl.innerHTML = `
          <div class="term-root" tabindex="-1">
            <div class="term-output"></div>
            <div class="term-input-row">
              <span class="term-prompt">operator@nexus:<span class="term-cwd"></span>$</span>
              <input type="text" class="term-input" spellcheck="false" autocomplete="off" aria-label="Terminal command input">
            </div>
          </div>
        `;

        const rootEl = win.bodyEl.querySelector('.term-root');
        const outEl = win.bodyEl.querySelector('.term-output');
        const cwdEl = win.bodyEl.querySelector('.term-cwd');
        const inputEl = win.bodyEl.querySelector('.term-input');

        function updatePrompt() {
          cwdEl.textContent = cwd;
          WM.setTitle(win.id, `Terminal — ${cwd}`);
        }

        function print(text, cls = '') {
          const div = document.createElement('div');
          div.className = 'term-line' + (cls ? ' ' + cls : '');
          div.textContent = text;
          outEl.appendChild(div);
          rootEl.scrollTop = rootEl.scrollHeight;
        }

        print('NEXUS OS Shell v2.5 — Connected to shared Virtual Filesystem.', 'accent');
        print('Type "help" for commands. Supports > / >> file redirection and Tab completion.', 'muted');
        updatePrompt();

        rootEl.addEventListener('click', () => {
          if (window.getSelection()?.toString()) return;
          inputEl.focus();
        });

        function tokenize(line) {
          const tokens = [];
          let cur = '';
          let quote = null;
          for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (quote) {
              if (ch === quote) quote = null;
              else cur += ch;
            } else if (ch === '"' || ch === "'") {
              quote = ch;
            } else if (/\s/.test(ch)) {
              if (cur) { tokens.push(cur); cur = ''; }
            } else {
              cur += ch;
            }
          }
          if (cur) tokens.push(cur);
          return tokens;
        }

        function buildTreeLines(dirPath, prefix = '') {
          const entries = VFS.list(dirPath);
          let lines = [];
          entries.forEach((entry, idx) => {
            const last = idx === entries.length - 1;
            const branch = last ? '└── ' : '├── ';
            lines.push(prefix + branch + entry.name + (entry.type === 'dir' ? '/' : ''));
            if (entry.type === 'dir') {
              lines = lines.concat(buildTreeLines(entry.path, prefix + (last ? '    ' : '│   ')));
            }
          });
          return lines;
        }

        async function runCommand(raw) {
          const trimmed = raw.trim();
          print(`operator@nexus:${cwd}$ ${raw}`);
          if (!trimmed) return;

          history.push(raw);
          histIdx = history.length;

          let redirMode = null;
          let redirTarget = null;
          let cmdPart = trimmed;

          const appendMatch = trimmed.match(/^(.*?)\s*>>\s*([^\s>]+)\s*$/);
          const writeMatch = !appendMatch && trimmed.match(/^(.*?)\s*>\s*([^\s>]+)\s*$/);
          if (appendMatch) {
            cmdPart = appendMatch[1];
            redirTarget = VFS.normalize(appendMatch[2], cwd);
            redirMode = 'append';
          } else if (writeMatch) {
            cmdPart = writeMatch[1];
            redirTarget = VFS.normalize(writeMatch[2], cwd);
            redirMode = 'write';
          }

          const argsList = tokenize(cmdPart);
          const cmd = (argsList.shift() || '').toLowerCase();
          const capturedOutput = [];

          const emitOut = (txt, cls = '') => {
            if (redirMode) capturedOutput.push(txt);
            else print(txt, cls);
          };

          try {
            switch (cmd) {
              case 'help':
                emitOut([
                  'Available NEXUS OS shell commands:',
                  '  ls [-l] [path]         List directory contents',
                  '  tree [path]            Render directory hierarchy tree',
                  '  cd <dir>               Change working directory',
                  '  pwd                    Print working directory',
                  '  cat <file>             Print file contents',
                  '  wc <file>              Count lines, words, and bytes in file',
                  '  touch <file>           Create empty file or update timestamp',
                  '  mkdir <dir>            Create new directory',
                  '  echo <text> [> file]   Print text or redirect (> / >>) into file',
                  '  cp <src> <dest>        Copy file or directory',
                  '  mv <src> <dest>        Move or rename file/directory',
                  '  rm [-r] <path>         Remove file or directory (-r recursive)',
                  '  find [term]            Search paths under current directory',
                  '  grep <pattern> <file>  Filter matching lines in file',
                  '  open <app|path>        Open app (explorer/editor/monitor/settings) or path',
                  '  ps                     List active OS processes & open windows',
                  '  kill <pid>             Close running window by PID',
                  '  df                     Show virtual storage usage & backend',
                  '  theme <name>           Set theme (obsidian|violet|emerald|amber|daylight)',
                  '  history | uptime | date | whoami | uname | clear'
                ].join('\n'));
                break;

              case 'clear':
                outEl.innerHTML = '';
                return;

              case 'pwd':
                emitOut(cwd);
                break;

              case 'whoami':
                emitOut('operator');
                break;

              case 'uname':
                emitOut('NEXUS-OS 2.5.0 browser-x64 VanillaJS-Kernel');
                break;

              case 'date':
                emitOut(new Date().toString());
                break;

              case 'uptime': {
                const sec = Math.floor((Date.now() - BOOT_TIME) / 1000);
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                emitOut(`up ${m}m ${s}s, ${WM.windows.size} active window(s), load avg: ${(Telemetry.cpu / 100).toFixed(2)}`);
                break;
              }

              case 'history':
                emitOut(history.map((h, i) => `  ${String(i + 1).padStart(3, ' ')}  ${h}`).join('\n'));
                break;

              case 'cd': {
                const target = VFS.normalize(argsList[0] || '/', cwd);
                const st = VFS.stat(target);
                if (!st) throw new Error(`cd: no such directory: ${target}`);
                if (st.type !== 'dir') throw new Error(`cd: not a directory: ${target}`);
                cwd = target;
                updatePrompt();
                break;
              }

              case 'ls': {
                const flags = argsList.filter(a => a.startsWith('-')).join('');
                const pathArg = argsList.find(a => !a.startsWith('-')) || cwd;
                const target = VFS.normalize(pathArg, cwd);
                const st = VFS.stat(target);
                if (!st) throw new Error(`ls: cannot access '${pathArg}': No such file or directory`);
                if (st.type === 'file') {
                  emitOut(VFS.basename(target));
                  break;
                }
                const items = VFS.list(target);
                if (!items.length) break;
                if (flags.includes('l')) {
                  const lines = items.map(i => {
                    const perm = i.type === 'dir' ? 'drwxr-xr-x' : '-rw-r--r--';
                    const sz = String(i.size).padStart(7, ' ');
                    const dt = new Date(i.mtime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    return `${perm}  operator  ${sz}  ${dt}  ${i.name}${i.type === 'dir' ? '/' : ''}`;
                  });
                  emitOut(lines.join('\n'));
                } else {
                  emitOut(items.map(i => i.type === 'dir' ? i.name + '/' : i.name).join('   '));
                }
                break;
              }

              case 'tree': {
                const target = VFS.normalize(argsList[0] || cwd, cwd);
                const st = VFS.stat(target);
                if (!st || st.type !== 'dir') throw new Error(`tree: not a directory: ${target}`);
                const lines = [target, ...buildTreeLines(target)];
                emitOut(lines.join('\n'));
                break;
              }

              case 'cat': {
                if (!argsList.length) throw new Error('cat: missing file operand');
                const out = argsList.map(p => VFS.readFile(VFS.normalize(p, cwd))).join('\n');
                emitOut(out);
                break;
              }

              case 'wc': {
                if (!argsList.length) throw new Error('wc: missing file operand');
                const target = VFS.normalize(argsList[0], cwd);
                const content = VFS.readFile(target);
                const lines = content ? content.split('\n').length : 0;
                const words = content.trim() ? content.trim().split(/\s+/).length : 0;
                const bytes = new Blob([content]).size;
                emitOut(`  ${lines} lines   ${words} words   ${bytes} bytes   ${target}`);
                break;
              }

              case 'echo':
                emitOut(argsList.join(' '));
                break;

              case 'touch': {
                if (!argsList.length) throw new Error('touch: missing file operand');
                for (const p of argsList) {
                  const full = VFS.normalize(p, cwd);
                  if (VFS.exists(full)) {
                    const st = VFS.stat(full);
                    if (st.type === 'file') await VFS.writeFile(full, st.content);
                  } else {
                    await VFS.writeFile(full, '');
                  }
                }
                break;
              }

              case 'mkdir': {
                if (!argsList.length) throw new Error('mkdir: missing directory operand');
                for (const p of argsList) {
                  await VFS.mkdir(VFS.normalize(p, cwd));
                }
                break;
              }

              case 'rm': {
                const recursive = argsList.includes('-r') || argsList.includes('-rf');
                const targets = argsList.filter(a => !a.startsWith('-'));
                if (!targets.length) throw new Error('rm: missing operand');
                for (const t of targets) {
                  await VFS.remove(VFS.normalize(t, cwd), recursive);
                }
                break;
              }

              case 'mv': {
                if (argsList.length < 2) throw new Error('mv: usage: mv <source> <dest>');
                await VFS.move(VFS.normalize(argsList[0], cwd), VFS.normalize(argsList[1], cwd));
                break;
              }

              case 'cp': {
                if (argsList.length < 2) throw new Error('cp: usage: cp <source> <dest>');
                await VFS.copy(VFS.normalize(argsList[0], cwd), VFS.normalize(argsList[1], cwd));
                break;
              }

              case 'find': {
                const term = (argsList[0] || '').toLowerCase();
                const prefix = cwd === '/' ? '/' : cwd + '/';
                const matches = Object.keys(VFS.nodes)
                  .filter(k => (k === cwd || k.startsWith(prefix)) && (!term || k.toLowerCase().includes(term)))
                  .sort();
                emitOut(matches.join('\n') || '(no matches)');
                break;
              }

              case 'grep': {
                if (argsList.length < 2) throw new Error('grep: usage: grep <pattern> <file>');
                const pattern = argsList[0].toLowerCase();
                const content = VFS.readFile(VFS.normalize(argsList[1], cwd));
                const hits = content
                  .split('\n')
                  .map((line, i) => `${i + 1}: ${line}`)
                  .filter(line => line.toLowerCase().includes(pattern));
                emitOut(hits.length ? hits.join('\n') : '(no matching lines)');
                break;
              }

              case 'df': {
                const st = VFS.stats();
                emitOut([
                  'Backend            Files   Dirs   Persisted Size',
                  `${NexusStorage.backend.padEnd(18, ' ')} ${String(st.files).padEnd(7, ' ')} ${String(st.dirs).padEnd(6, ' ')} ${formatBytes(st.bytes)}`
                ].join('\n'));
                break;
              }

              case 'ps': {
                const lines = [
                  'PID    STATE      NAME',
                  '1      system     nexus-compositor',
                  '2      system     vfs-storage-daemon'
                ];
                for (const w of WM.windows.values()) {
                  const state = w.minimized ? 'minimized' : (WM.activeId === w.id ? 'active' : 'running');
                  lines.push(`${String(w.pid).padEnd(6, ' ')} ${state.padEnd(10, ' ')} ${w.title}`);
                }
                emitOut(lines.join('\n'));
                break;
              }

              case 'kill': {
                const pid = Number(argsList[0]);
                if (!pid) throw new Error('kill: specify a window PID from "ps"');
                if (pid <= 2) throw new Error('kill: cannot terminate protected kernel daemon');
                const found = [...WM.windows.values()].find(w => w.pid === pid);
                if (!found) throw new Error(`kill: no window with PID ${pid}`);
                WM.close(found.id);
                print(`Terminated process ${pid} (${found.title})`, 'success');
                break;
              }

              case 'open': {
                const target = argsList[0];
                if (!target) throw new Error('open: specify an app id or file path');
                if (APPS[target]) {
                  WM.open(target);
                  print(`Launched ${APPS[target].name}`, 'success');
                } else {
                  const full = VFS.normalize(target, cwd);
                  const st = VFS.stat(full);
                  if (!st) throw new Error(`open: no app or path matching '${target}'`);
                  if (st.type === 'dir') WM.open('explorer', { path: full });
                  else WM.open('editor', { filePath: full });
                  print(`Opened ${full}`, 'success');
                }
                break;
              }

              case 'theme': {
                const t = (argsList[0] || '').toLowerCase();
                const valid = ['obsidian', 'violet', 'emerald', 'amber', 'daylight'];
                if (!valid.includes(t)) throw new Error(`theme: choose one of ${valid.join(', ')}`);
                await SettingsState.update({ theme: t });
                print(`Switched theme to ${t}`, 'success');
                break;
              }

              default:
                throw new Error(`${cmd}: command not found (type "help")`);
            }

            if (redirMode && redirTarget) {
              const payload = capturedOutput.join('\n');
              if (redirMode === 'append' && VFS.exists(redirTarget)) {
                const prev = VFS.readFile(redirTarget);
                await VFS.writeFile(redirTarget, prev ? prev + '\n' + payload : payload);
              } else {
                await VFS.writeFile(redirTarget, payload);
              }
            }
          } catch (err) {
            print(err.message, 'error');
          }
        }

        inputEl.addEventListener('keydown', (e) => {
          if (e.ctrlKey && e.key.toLowerCase() === 'l') {
            e.preventDefault();
            outEl.innerHTML = '';
            return;
          }
          if (e.key === 'Enter') {
            e.preventDefault();
            const val = inputEl.value;
            inputEl.value = '';
            runCommand(val);
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (history.length && histIdx > 0) {
              histIdx--;
              inputEl.value = history[histIdx];
            }
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (histIdx < history.length - 1) {
              histIdx++;
              inputEl.value = history[histIdx];
            } else {
              histIdx = history.length;
              inputEl.value = '';
            }
          } else if (e.key === 'Tab') {
            e.preventDefault();
            const val = inputEl.value;
            const parts = val.split(/\s+/);
            if (parts.length <= 1) {
              const cmds = ['help','ls','tree','cd','pwd','cat','wc','touch','mkdir','echo','cp','mv','rm','find','grep','open','ps','kill','df','theme','history','uptime','clear','date','whoami','uname'];
              const match = cmds.find(c => c.startsWith(parts[0]));
              if (match) inputEl.value = match + ' ';
            } else {
              const partial = parts[parts.length - 1];
              try {
                const entries = VFS.list(cwd);
                const hit = entries.find(en => en.name.startsWith(partial));
                if (hit) {
                  parts[parts.length - 1] = hit.name + (hit.type === 'dir' ? '/' : '');
                  inputEl.value = parts.join(' ');
                }
              } catch (_) {}
            }
          }
        });

        // Sync CWD if deleted externally
        win.cleanupFns.push(Bus.on('fs:change', () => {
          if (!VFS.exists(cwd)) {
            cwd = '/';
            updatePrompt();
          }
        }));

        setTimeout(() => inputEl.focus(), 20);
        return {
          onFocus() { inputEl.focus(); }
        };
      };

      /* ---------------- 7C. CODE STUDIO (HTML/CSS/JS Editor + Sandboxed Live Preview) ---------------- */
      AppMount.editor = (win, args = {}) => {
        const PROJECT_FILES = [
          '/Projects/webapp/index.html',
          '/Projects/webapp/style.css',
          '/Projects/webapp/script.js'
        ];
        let openTabs = [...PROJECT_FILES].filter(p => VFS.exists(p));
        if (!openTabs.length) {
          const all = VFS.allFiles();
          if (all.length) openTabs = [all[0]];
        }
        if (args.filePath && VFS.exists(args.filePath) && VFS.stat(args.filePath).type === 'file') {
          const norm = VFS.normalize(args.filePath);
          if (!openTabs.includes(norm)) openTabs.push(norm);
        }

        let activeFile = (args.filePath && VFS.normalize(args.filePath)) || openTabs[0] || '';
        const buffers = new Map();
        const dirty = new Set();
        let autoRun = true;
        let layout = 'split';
        let previewTimer = null;
        const channelId = 'preview-' + win.id;

        function ensureBuffer(path) {
          if (path && !buffers.has(path)) {
            try { buffers.set(path, VFS.readFile(path)); }
            catch (_) { buffers.set(path, ''); }
          }
        }
        openTabs.forEach(ensureBuffer);

        win.bodyEl.innerHTML = `
          <div class="ed-root">
            <div class="ed-toolbar">
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                <select class="input" data-role="file-picker" aria-label="Open file from Virtual Filesystem"></select>
                <button type="button" class="btn btn-sm btn-primary" data-act="save" title="Save File (Ctrl/Cmd+S)">Save</button>
                <button type="button" class="btn btn-sm" data-act="run" title="Run Sandboxed Preview">Run</button>
                <label style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-secondary);cursor:pointer">
                  <input type="checkbox" data-role="autorun" checked> Auto-run
                </label>
              </div>
              <div style="display:flex;align-items:center;gap:4px">
                <button type="button" class="btn btn-sm" data-layout="split">Split</button>
                <button type="button" class="btn btn-sm" data-layout="code">Code</button>
                <button type="button" class="btn btn-sm" data-layout="preview">Preview</button>
              </div>
            </div>
            <div class="ed-tabs" role="tablist"></div>
            <div class="ed-workspace" data-layout="split">
              <div class="ed-code-pane">
                <div class="ed-editor-wrap">
                  <div class="ed-gutter" aria-hidden="true">1</div>
                  <textarea class="ed-textarea" spellcheck="false" aria-label="Source Code Editor"></textarea>
                </div>
              </div>
              <div class="ed-preview-pane">
                <div class="ed-preview-header">
                  <span>Sandboxed Preview (<code>sandbox="allow-scripts"</code>)</span>
                  <span data-role="preview-target">/Projects/webapp</span>
                </div>
                <iframe class="ed-iframe" sandbox="allow-scripts" title="Sandboxed Live Preview"></iframe>
                <div class="ed-console">
                  <div class="ed-console-bar">
                    <span>Sandbox Console</span>
                    <div style="display:flex;gap:6px">
                      <button type="button" class="btn btn-sm" data-act="clear-console" style="padding:1px 6px;font-size:11px">Clear</button>
                      <button type="button" class="btn btn-sm" data-act="toggle-console" style="padding:1px 6px;font-size:11px">Toggle</button>
                    </div>
                  </div>
                  <div class="ed-console-logs"></div>
                </div>
              </div>
            </div>
          </div>
        `;

        const pickerEl = win.bodyEl.querySelector('[data-role="file-picker"]');
        const tabsEl = win.bodyEl.querySelector('.ed-tabs');
        const workspaceEl = win.bodyEl.querySelector('.ed-workspace');
        const textarea = win.bodyEl.querySelector('.ed-textarea');
        const gutter = win.bodyEl.querySelector('.ed-gutter');
        const iframe = win.bodyEl.querySelector('.ed-iframe');
        const previewTargetEl = win.bodyEl.querySelector('[data-role="preview-target"]');
        const consoleEl = win.bodyEl.querySelector('.ed-console');
        const logsEl = win.bodyEl.querySelector('.ed-console-logs');
        const autoRunChk = win.bodyEl.querySelector('[data-role="autorun"]');

        function updateGutter() {
          const lines = (textarea.value.match(/\n/g)?.length || 0) + 1;
          let out = '';
          for (let i = 1; i <= lines; i++) out += i + '\n';
          gutter.textContent = out;
        }

        function refreshPicker() {
          const all = VFS.allFiles();
          pickerEl.innerHTML = all.map(p => `<option value="${escapeHtml(p)}" ${p === activeFile ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('');
        }

        function renderTabs() {
          tabsEl.innerHTML = openTabs.map(p => `
            <button type="button" class="ed-tab ${p === activeFile ? 'active' : ''}" data-tab="${escapeHtml(p)}">
              <span>${escapeHtml(VFS.basename(p))}</span>
              ${dirty.has(p) ? '<span class="dirty-dot" title="Unsaved changes"></span>' : ''}
              ${openTabs.length > 1 ? `<span class="ed-tab-close" data-close-tab="${escapeHtml(p)}" title="Close tab">×</span>` : ''}
            </button>
          `).join('');
          WM.setTitle(win.id, `Code Studio — ${activeFile || 'No file'}${dirty.has(activeFile) ? ' •' : ''}`);
        }

        function loadActiveIntoEditor() {
          if (!activeFile) {
            textarea.value = '';
            updateGutter();
            renderTabs();
            return;
          }
          ensureBuffer(activeFile);
          textarea.value = buffers.get(activeFile) ?? '';
          updateGutter();
          refreshPicker();
          renderTabs();
        }

        function openFileInStudio(path) {
          const norm = VFS.normalize(path);
          if (!VFS.exists(norm) || VFS.stat(norm).type !== 'file') return;
          if (!openTabs.includes(norm)) openTabs.push(norm);
          if (!dirty.has(norm)) buffers.set(norm, VFS.readFile(norm));
          activeFile = norm;
          loadActiveIntoEditor();
          runPreview();
        }

        async function saveActive() {
          if (!activeFile) return;
          const val = buffers.get(activeFile) ?? '';
          await VFS.writeFile(activeFile, val);
          dirty.delete(activeFile);
          renderTabs();
          runPreview();
          notify(`Saved ${VFS.basename(activeFile)}`);
        }

        function getEffectiveContent(path) {
          if (buffers.has(path)) return buffers.get(path);
          if (VFS.exists(path)) return VFS.readFile(path);
          return '';
        }

        function runPreview() {
          logsEl.innerHTML = '';
          if (!activeFile) return;
          const dir = VFS.parent(activeFile);
          let html = '';
          let css = '';
          let js = '';

          const dirHtml = VFS.normalize('index.html', dir);
          const dirCss = VFS.normalize('style.css', dir);
          const dirJs = VFS.normalize('script.js', dir);

          if (activeFile.endsWith('.html') && VFS.basename(activeFile) !== 'index.html') {
            html = getEffectiveContent(activeFile);
            previewTargetEl.textContent = activeFile;
          } else if (VFS.exists(dirHtml) || buffers.has(dirHtml)) {
            html = getEffectiveContent(dirHtml);
            css = getEffectiveContent(dirCss);
            js = getEffectiveContent(dirJs);
            previewTargetEl.textContent = dir;
          } else if (activeFile.endsWith('.js')) {
            html = '<div style="font-family:system-ui;padding:16px;color:#334155">Executing standalone script in sandbox console...</div>';
            js = getEffectiveContent(activeFile);
            previewTargetEl.textContent = activeFile;
          } else {
            const safeText = escapeHtml(getEffectiveContent(activeFile));
            html = `<pre style="margin:0;padding:16px;font-family:monospace;white-space:pre-wrap;color:#0f172a">${safeText}</pre>`;
            previewTargetEl.textContent = activeFile;
          }

          const bridge = [
            '<script>',
            '(function() {',
            '  var cid = ' + JSON.stringify(channelId) + ';',
            '  function send(level, args) {',
            '    try {',
            '      var msg = Array.prototype.slice.call(args).map(function(a) {',
            '        if (typeof a === "object") { try { return JSON.stringify(a); } catch(_) { return String(a); } }',
            '        return String(a);',
            '      }).join(" ");',
            '      parent.postMessage({ source: "nexus-sandbox", cid: cid, level: level, msg: msg }, "*");',
            '    } catch (_) {}',
            '  }',
            '  var oLog = console.log, oWarn = console.warn, oErr = console.error;',
            '  console.log = function() { send("log", arguments); oLog.apply(console, arguments); };',
            '  console.warn = function() { send("warn", arguments); oWarn.apply(console, arguments); };',
            '  console.error = function() { send("error", arguments); oErr.apply(console, arguments); };',
            '  window.addEventListener("error", function(e) { send("error", [e.message + " (line " + e.lineno + ")"]); });',
            '})();',
            '<\/script>'

          const d = e.data;
          if (!d || d.source !== 'nexus-sandbox' || d.cid !== channelId) return;
          const row = document.createElement('div');
          if (d.level === 'warn') row.className = 'log-warn';
          if (d.level === 'error') row.className = 'log-error';
          row.textContent = `[${d.level}] ${d.msg}`;
          logsEl.appendChild(row);
          logsEl.scrollTop = logsEl.scrollHeight;
        }
        window.addEventListener('message', onSandboxMsg);

            e.preventDefault();

            const end = textarea.selectionEnd;
            textarea.value = textarea.value.slice(0, s) + '  ' + textarea.value.slice(end);

        function drawChart(canvas, series, strokeColor, fillColor) {
          const rect = canvas.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          const dpr = window.devicePixelRatio || 1;
          canvas.width = Math.round(rect.width * dpr);
          canvas.height = Math.round(rect.height * dpr);
          const ctx = canvas.getContext('2d');
          ctx.scale(dpr, dpr);
          const w = rect.width;
          const h = rect.height;

          ctx.clearRect(0, 0, w, h);
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.14)';
          ctx.lineWidth = 1;
          for (let i = 1; i <= 3; i++) {
            const y = (h / 4) * i;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
          }

          ctx.beginPath();
          series.forEach((val, idx) => {
            const x = (idx / (series.length - 1)) * w;
            const y = h - (Math.min(100, Math.max(0, val)) / 100) * (h - 10) - 5;
            if (idx === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          });
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.lineTo(w, h);
          ctx.lineTo(0, h);
          ctx.closePath();
          ctx.fillStyle = fillColor;
          ctx.fill();
        }
